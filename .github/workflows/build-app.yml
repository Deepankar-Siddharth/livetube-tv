name: Build Android TV app

on:
  pull_request:
    paths:
      - "app/**"
      - "data/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build unsigned APK
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate channel data
        run: python scripts/validate_channels.py data/channels.json

      - name: Run tests, lint, and debug build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: livetube-tv-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign, verify, and publish APK
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate channel data
        run: python scripts/validate_channels.py data/channels.json

      - name: Import signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          python - <<'PY'
          import base64
          import os
          import pathlib
          import stat

          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          try:
              key_bytes = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if not (key_bytes.startswith(b"PK\x03\x04") or key_bytes.startswith(b"\xfe\xed\xfe\xed")):
              raise SystemExit("Decoded signing credentials are not a supported keystore archive")

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          key_path = runner_temp / "release.jks"
          key_path.write_bytes(key_bytes)
          key_path.chmod(stat.S_IREAD | stat.S_IWRITE)
          PY

          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build and test signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pgithub.owner="$GITHUB_REPOSITORY_OWNER" \
            -Pgithub.repository="$GITHUB_REPOSITORY_NAME" \
            -Pgithub.branch="${{ github.event.repository.default_branch }}" \
            testReleaseUnitTest lintRelease assembleRelease

      - name: Verify APK signature and identity
        id: artifact
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -type f -name '*-release.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "::error::assembleRelease did not produce an APK"
            exit 1
          fi

          apksigner_bin="$(command -v apksigner || true)"
          if [ -z "$apksigner_bin" ]; then
            apksigner_bin="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          fi
          "$apksigner_bin" verify --verbose --print-certs "$apk_path" 2>&1 | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme" "$RUNNER_TEMP/apksigner.txt"

          if command -v apkanalyzer >/dev/null 2>&1; then
            analyzer="$(command -v apkanalyzer)"
          else
            analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          fi
          version_name="$($analyzer manifest version-name "$apk_path")"
          version_code="$($analyzer manifest version-code "$apk_path")"
          tag_version="${EXPECTED_VERSION#v}"
          if [ "$version_name" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match APK version_name $version_name"
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::invalid APK versionCode: $version_code"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-assets"
          release_asset="$RUNNER_TEMP/release-assets/livetube-tv-$version_name.apk"
          cp "$apk_path" "$release_asset"
          sha256="$(sha256sum "$release_asset" | cut -d' ' -f1)"
          # apksigner labels differ between build-tools releases ("Signer #1 certificate
          # SHA-256 digest:" on older tools, "V3.0 Signer: certificate SHA-256 digest:" on
          # newer ones), so match any certificate digest line and strip colour codes.
          signer_sha256="$(sed -e 's/\x1b\[[0-9;]*m//g' -n -e 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr -d '[:space:]')"
          if ! [[ "$signer_sha256" =~ ^[A-Fa-f0-9:]{64,}$ ]]; then
            echo "::error::could not read the signer certificate SHA-256 digest"
            exit 1
          fi

          {
            echo "asset=$release_asset"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "sha256=$sha256"
            echo "signer_sha256=$signer_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_ASSET: ${{ steps.artifact.outputs.asset }}
          VERSION_NAME: ${{ steps.artifact.outputs.version_name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json url >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_ASSET#LiveTube TV signed APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_ASSET#LiveTube TV signed APK" \
              --verify-tag \
              --title "LiveTube TV v$VERSION_NAME" \
              --generate-notes \
              --latest
          fi

      - name: Read NewPipeExtractor build metadata
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^newpipe\.version=//p' gradle.properties | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish conflict-safe update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.artifact.outputs.version_name }}
          VERSION_CODE: ${{ steps.artifact.outputs.version_code }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
          SIGNER_SHA256: ${{ steps.artifact.outputs.signer_sha256 }}
          EXTRACTOR_VERSION: ${{ steps.buildmeta.outputs.version }}
        run: |
          set -euo pipefail
          metadata_path="data/build-metadata.json"
          current_sha="$(gh api "repos/$REPOSITORY/contents/$metadata_path?ref=$DEFAULT_BRANCH" --jq .sha)"

          CURRENT_METADATA_SHA="$current_sha" python - <<'PY'
          import base64
          import datetime
          import json
          import os
          import pathlib

          now = (
              datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          metadata = {
              "schema_version": 1,
              "app_version": os.environ["VERSION_NAME"],
               "newpipe_extractor_version": os.environ.get("EXTRACTOR_VERSION", "").removeprefix("v"),
               "build_date": now[:10],
               "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
               "release_tag": os.environ["RELEASE_TAG"],
              "commit_sha": os.environ["SOURCE_SHA"],
              "built_at": now,
              "apk_url": (
                  f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}"
                  f"/releases/latest/download/livetube-tv-{os.environ['VERSION_NAME']}.apk"
              ),
              "sha256": os.environ["APK_SHA256"],
              "signature_sha256": os.environ["SIGNER_SHA256"].lower().replace(":", ""),
              "release_notes_url": (
                  f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}"
                  f"/releases/tag/{os.environ['RELEASE_TAG']}"
              ),
              "minimum_supported_version_code": 1,
              "published": True,
              "published_at": now,
          }
          encoded = base64.b64encode(
              (json.dumps(metadata, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
          ).decode("ascii")
          request = {
              "message": f"build: publish update metadata for v{metadata['version_name']}",
              "content": encoded,
              "sha": os.environ["CURRENT_METADATA_SHA"],
              "branch": os.environ["DEFAULT_BRANCH"],
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "metadata-request.json").write_text(
              json.dumps(request), encoding="utf-8"
          )
          PY

          gh api --method PUT "repos/$REPOSITORY/contents/$metadata_path" \
            --input "$RUNNER_TEMP/metadata-request.json" >/dev/null

      - name: Remove signing credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties" "$RUNNER_TEMP/gradle.properties"

      - name: Add release summary
        if: ${{ success() }}
        run: |
          {
            echo "## LiveTube TV release"
            echo ""
            echo "- Version: \`v${{ steps.artifact.outputs.version_name }}\` (\`${{ steps.artifact.outputs.version_code }}\`)"
            echo "- APK SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo "- APK signature verified with apksigner."
          } >> "$GITHUB_STEP_SUMMARY"
