name: Validate catalogue

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "portal/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/generate-m3u.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "app/**"
      - "portal/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      check_live_urls:
        description: "Make best-effort HTTPS requests to every YouTube live URL"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Strict schema and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate channels.json
        run: python scripts/validate_channels.py data/channels.json

      - name: Optionally validate live URLs
        if: ${{ inputs.check_live_urls == true }}
        run: python scripts/validate_channels.py data/channels.json --check-network --timeout 15

      - name: Verify generated playlist
        run: python scripts/build_m3u.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check portal JavaScript syntax
        run: node --check portal/app.js

      - name: Verify bundled catalogue matches source
        run: cmp data/channels.json app/src/main/assets/channels.json
