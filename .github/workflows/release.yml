name: Create signed LiveTube TV release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag, for example v1.0.0"
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: livetube-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Validate release tag input
        id: request
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.0.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag and application version agree
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          app_version="$(sed -n 's/^app\.version=//p' gradle.properties | head -n1)"
          tag_version="${RELEASE_TAG#v}"
          test -n "$app_version"
          test "$app_version" = "$tag_version"
          echo "Release commit: $head_commit"

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check required signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/livetube-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if ((${#missing[@]})); then
            echo "::error::Missing required GitHub Actions signing secrets: ${missing[*]}"
            echo "Configure the secrets in the protected release environment; no unsigned release will be published."
            exit 1
          fi
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          try:
              key_bytes = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("::error::ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if not (key_bytes.startswith(b"PK\x03\x04") or key_bytes.startswith(b"\xfe\xed\xfe\xed")):
              raise SystemExit("::error::Decoded signing credentials are not a supported keystore archive")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          path.write_bytes(key_bytes)
          path.chmod(0o600)
          PY

      - name: Validate catalogue, tests, and debug lint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_channels.py data/channels.json
          python scripts/build_m3u.py --check
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
          node --check portal/app.js
          cmp data/channels.json app/src/main/assets/channels.json
          ./gradlew --no-daemon --stacktrace test lintDebug

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/livetube-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -Pgithub.owner="$GITHUB_REPOSITORY_OWNER" \
            -Pgithub.repository="$GITHUB_REPOSITORY_NAME" \
            -Pgithub.branch="$DEFAULT_BRANCH"

      - name: Verify release APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -type f -name '*-release.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          zipalign="$build_tools/zipalign"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk_path" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme.*true" "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v3 scheme.*true" "$RUNNER_TEMP/apksigner.txt"
          "$zipalign" -c -v 4 "$apk_path"
          badging="$($aapt dump badging "$apk_path")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p" | head -n1)"
          test "$package_name" = "com.livetube.tv"
          test "$version_name" = "${RELEASE_TAG#v}"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          asset_name="LiveTubeTV-${RELEASE_TAG}-release.apk"
          release_asset="$RUNNER_TEMP/$asset_name"
          cp "$apk_path" "$release_asset"
          sha256="$(sha256sum "$release_asset" | cut -d' ' -f1)"
          printf '%s  %s\n' "$sha256" "$asset_name" > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "asset=$release_asset" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish the verified stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.artifact.outputs.asset }}
          RELEASE_ASSET_NAME: ${{ steps.artifact.outputs.asset_name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # LiveTube TV v${RELEASE_TAG#v}

          Initial test release of LiveTube TV for Android TV.

          ## Included

          - Android TV application
          - YouTube live-channel extraction using NewPipeExtractor
          - Media3/ExoPlayer playback
          - Remote channel catalogue
          - Channel caching
          - GitHub release update checking
          - Android TV launcher branding
          - Android TV banner
          - Initial playback/retry handling

          ## Testing

          Install the APK on an Android TV device or emulator.

          This is the first public test release.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET#$RELEASE_ASSET_NAME" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_ASSET#$RELEASE_ASSET_NAME" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --verify-tag \
              --title "LiveTube TV v${RELEASE_TAG#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
          echo "Published $RELEASE_TAG at commit $(git rev-parse HEAD)"
          echo "SHA-256: $SHA256"

      - name: Remove signing credentials
        if: ${{ always() }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/livetube-release.jks
        run: rm -f "$ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/apksigner.txt"

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## LiveTube TV release"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- APK: \`${{ steps.artifact.outputs.asset_name }}\`"
            echo "- SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
